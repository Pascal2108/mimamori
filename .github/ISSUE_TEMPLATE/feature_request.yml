name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public: please leave out private data such as host names or serial numbers.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem behind the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How mimamori could help with it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, examples from other tools, screenshots.
    validations:
      required: false
