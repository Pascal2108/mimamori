name: Build and publish image

on:
  push:
    branches: [main, beta]
    tags: ["v*.*.*"]      # a version tag such as v1.0.0 makes a release
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild, picks up security updates of the base image and libraries
  workflow_dispatch:

# Each job asks for what it needs on top of this
permissions:
  contents: read

# Actions are pinned to a commit, since a tag can be moved to other code; Dependabot updates them
jobs:
  # Two images from one repository: the server, and the small agent for the monitored hosts
  publish:
    strategy:
      matrix:
        include:
          - image: mimamori
            dockerfile: Dockerfile
          - image: mimamori-agent
            dockerfile: Dockerfile.agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # the version tags, to find the newest stable release

      # Image tags:
      #   main (and the weekly rebuild of it)  :latest and the major version, e.g. :1
      #   the beta branch                      :beta
      #   the tag v1.2.3                       :1.2.3 and :1
      #   the tag v1.2.4-beta.1                :1.2.4-beta.1 only
      # The major tag lets an agent be pinned to one major version and still receive the weekly
      # security rebuilds. Images go to GHCR only (Docker Hub is not used for now).
      - id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # Newest stable release, e.g. v1.2.3 (tags with a suffix such as -beta.1 do not count)
          stable=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          major() { v="${1#v}"; echo "${v%%.*}"; }
          case "$GITHUB_REF" in
            refs/tags/v*-*)  tags="${GITHUB_REF_NAME#v}" ;;
            refs/tags/v*)    tags="${GITHUB_REF_NAME#v} $(major "$GITHUB_REF_NAME")" ;;
            refs/heads/main) tags="latest${stable:+ $(major "$stable")}" ;;
            *)               tags="beta" ;;
          esac
          {
            echo "tags<<EOF"
            for t in $tags; do
              echo "ghcr.io/pascal2108/$IMAGE:$t"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # The version shown on the page: the tag, or the branch and commit
          case "$GITHUB_REF" in
            refs/tags/v*) echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *)            echo "version=$GITHUB_REF_NAME-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for Intel/AMD and ARM servers (e.g. Raspberry Pi, ARM cloud instances)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}

      # Every pushed image is scanned for known vulnerabilities in its system and Python
      # packages, by its digest, so it is exactly the image that was just built. Found are
      # listed in the log; one that is high or critical and has a fix fails the run (and with
      # it the release page), so it gets looked at. The image is published anyway: the weekly
      # rebuild must not stop bringing fixes because one package has no update yet.
      # trivy-action had its tags replaced by malicious code in March 2026 (GHSA-69fq-xp46-6x23):
      # pinned to the commit of the immutable release v0.36.0, and Trivy itself to a fixed version.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/pascal2108/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          version: v0.76.1
          scanners: vuln
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/pascal2108/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          version: v0.76.1
          skip-setup-trivy: true
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # A version tag also gets a release page on GitHub, once its image exists.
  # A tag with a suffix such as v1.0.2-beta.1 is marked as a pre-release, never as the latest.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          case "$GITHUB_REF_NAME" in
            *-*) set -- --prerelease ;;
            *)   # notes since the last stable release, not since its own beta with the same code
                 prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
                 set -- ${prev:+--notes-start-tag "$prev"} ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag "$@"
        env:
          GH_TOKEN: ${{ github.token }}
