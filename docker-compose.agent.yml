# The mimamori agent, for every host whose drives you want to watch.
# Needs agent.env next to it, with the two values from Settings → Agents on the mimamori page.
# Start with: docker compose -f docker-compose.agent.yml up -d
services:
  mimamori-agent:
    image: ghcr.io/pascal2108/mimamori-agent:latest
    container_name: mimamori-agent
    restart: unless-stopped
    env_file:
      - agent.env                 # SERVER_URL and AGENT_KEY
    environment:
      AGENT_NAME: docker-host     # CHANGE: name of this host, as the page shows it
      # DEVICES: /dev/sda,/dev/nvme0   # (optional) check only these; after a colon a smartctl -d type, e.g. /dev/sdb:sat
      # LOG_LEVEL: INFO           # (optional) DEBUG for more detail in the log
    devices:                      # CHANGE: every drive to watch (list them with: ls /dev/sd? /dev/nvme?)
      - /dev/sda
    tmpfs:
      - /tmp:size=1m
    # Security hardening, leave as it is. Reading raw drives needs root inside the container;
    # every capability is dropped except SYS_RAWIO (SATA/SAS drives) and SYS_ADMIN (only
    # needed for NVMe drives: remove that line if the host has none).
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    # (optional) On the host that runs the server: join its network and use
    # SERVER_URL=http://mimamori:8000 in agent.env. The messages stay encrypted end to end.
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: nginx_reverse_proxy   # the Docker network of the mimamori server
