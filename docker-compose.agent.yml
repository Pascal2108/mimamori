# The mimamori agent, for every host whose drives you want to watch.
# Needs agent.env next to it, with the two values from Settings → Agents on the mimamori page.
# Start with: docker compose -f docker-compose.agent.yml up -d
services:
  mimamori-agent:
    # Major version 0. It only changes when you run "docker compose pull": update agents by
    # hand and read the release notes first. The server can stay on :latest; it works with
    # every older agent.
    image: ghcr.io/pascal2108/mimamori-agent:0
    container_name: mimamori-agent
    restart: unless-stopped
    env_file:
      - agent.env                 # SERVER_URL and AGENT_KEY
    environment:
      AGENT_NAME: docker-host     # CHANGE: name of this host, as the page shows it
      # DEVICES: /dev/sda,/dev/nvme0   # (optional) check only these; after a colon a smartctl -d type, e.g. /dev/sdb:sat
      # LOG_LEVEL: INFO           # (optional) DEBUG for more detail in the log
      # AGENT_KEY_FILE: /run/secrets/agent_key   # (optional) see "secrets" below
    # CHANGE: every drive to watch (list them with: ls /dev/sd? /dev/nvme?), each written as
    # /dev/sdX:/dev/sdX:r. The :r lets the container only read the drive, never write to it.
    devices:
      - /dev/sda:/dev/sda:r
    # (optional) Missing security updates of this host: mount its OS and package list
    # read-only, and the server checks them against the OSV vulnerability database.
    # Debian, Ubuntu, Proxmox: remove the # in front of the first three lines.
    # Alpine: remove it in front of the first two lines and the last one.
    # volumes:
    #   - /etc/os-release:/host/etc/os-release:ro
    #   - /var/lib/dpkg:/host/var/lib/dpkg:ro
    #   - /lib/apk/db:/host/lib/apk/db:ro
    # (optional) Keep AGENT_KEY out of the environment, where "docker inspect" shows it: put
    # the key alone into a file agent_key next to this one (chmod 600 agent_key), remove it
    # from agent.env, and remove the # in front of AGENT_KEY_FILE above, these two lines and
    # the "secrets" lines at the end.
    # secrets:
    #   - agent_key
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev
    # Security hardening, leave as it is. Reading raw drives needs root inside the container,
    # so the agent splits itself at start: a small root part that only runs smartctl, and the
    # part that talks to the network, which becomes the user "nobody" without any capability.
    # Every capability is dropped except SETUID/SETGID (for that split; the root part gives
    # them up right after it), SYS_RAWIO (SATA/SAS drives) and SYS_ADMIN (only for NVMe
    # drives: remove that line if the host has none).
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID                # to drop to an unprivileged user at start
      - SETGID
      - SYS_RAWIO
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    # (optional) On the host that runs the server: join its network and use
    # SERVER_URL=http://mimamori:8000 in agent.env. The messages stay encrypted end to end.
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: nginx_reverse_proxy   # the Docker network of the mimamori server

# secrets:
